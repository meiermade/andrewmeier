name: Preview
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            app/src/App/package-lock.json
            e2e/package-lock.json
      - name: Restore tools and dependencies
        working-directory: ./app
        run: |
          dotnet tool restore
          dotnet paket restore
      - name: Run tests
        working-directory: ./app
        run: ./fake.sh Test --single-target
      - name: Install Tailwind CSS
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64 \
            --output /tmp/tailwindcss
          echo 'dc61b3ac6b8c9ca874c0cc4c57b2409791a64c5540404ca5f5367360babc313a  /tmp/tailwindcss' | sha256sum --check
          sudo install /tmp/tailwindcss /usr/local/bin/tailwindcss
      - name: Run local E2E
        working-directory: ./app
        run: ./fake.sh TestE2E
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: andymeier-preview-e2e
          path: |
            e2e/playwright-report
            e2e/test-results
            /tmp/andymeier-e2e
          if-no-files-found: ignore
  preview:
    name: Preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Install Packages
        working-directory: ./pulumi
        run: npm ci
      - name: TypeScript Check
        working-directory: ./pulumi
        run: npm run check
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest
      - name: Expose GitHub Actions cache env
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])
      - name: Authenticate Pulumi
        uses: pulumi/auth-actions@v2
        with:
          organization: meiermade
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:meiermade
      - name: Preview
        uses: pulumi/actions@v7
        with:
          work-dir: ./pulumi
          command: preview
          stack-name: prod
          diff: true
          comment-on-pr: true
